name: Build IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: WireGuard/go.mod
          cache-dependency-path: WireGuard/go.sum
      # A fresh runner otherwise recompiles every Swift package and app target on each IPA build.
      # Keep this cache specific to the selected Xcode and package/project graph. Xcode still
      # checks source changes when restoring an older commit's build products.
      - name: Restore Xcode build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .spm
            .derived-release/Build
            .derived-release/ModuleCache.noindex
          key: ipa-xcode27.0-arm64-${{ hashFiles('BitChordKit/Package.resolved', 'BitChordKit/Package.swift', 'App/BitChord.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            ipa-xcode27.0-arm64-${{ hashFiles('BitChordKit/Package.resolved', 'BitChordKit/Package.swift', 'App/BitChord.xcodeproj/project.pbxproj') }}-
      - name: Build proxy engine and package IPA
        run: scripts/make-ipa.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BitChord-IPA
          path: build/BitChord-*.ipa
          if-no-files-found: error
          # IPA is already a ZIP archive; recompressing it only spends CPU time.
          compression-level: 0
